[package]
name = "tflick-ui"
edition.workspace = true
version.workspace = true
license.workspace = true

[dependencies]
# runtime_shaders: no Metal Toolchain needed to build (xcodebuild -downloadComponent MetalToolchain for precompiled).
gpui = { version = "0.2.2", features = ["runtime_shaders"] }
raw-window-handle = "0.6"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSEvent", "NSResponder", "NSView", "NSWindow"] }
objc2-foundation = { version = "0.3", features = ["NSGeometry"] }

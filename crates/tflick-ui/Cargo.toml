[package]
name = "tflick-ui"
edition.workspace = true
version.workspace = true
license.workspace = true

[dependencies]
anyhow.workspace = true
# runtime_shaders: no Metal Toolchain needed to build (xcodebuild -downloadComponent MetalToolchain for precompiled).
gpui = { version = "0.2.2", features = ["runtime_shaders"] }
raw-window-handle = "0.6"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSApplication", "NSEvent", "NSResponder", "NSRunningApplication", "NSScreen", "NSView", "NSWindow", "NSWorkspace"] }
objc2-foundation = { version = "0.3", features = ["NSGeometry"] }
tflick-ipc = { version = "0.1.0", path = "../tflick-ipc" }
serde_json = "1.0.154"
accessibility-sys = "0.2"
core-foundation = "0.10"
